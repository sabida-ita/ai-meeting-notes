<!DOCTYPE html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사례조사 대시보드</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --panel: #ffffff;
    --panel-alt: #fbfbfa;
    --border: #e3e2de;
    --text: #1f1e1c;
    --muted: #6b6963;
    --accent: #3f6d4e;
    --accent-soft: #e6efe8;
    --warn-bg: #fdf1dc;
    --warn-text: #8a5a10;
    --warn-border: #e9cf9d;
    --ok-bg: #e6efe8;
    --ok-text: #2f5c3d;
    --ok-border: #c3dbc9;
    --guess-bg: #ecebfa;
    --guess-text: #4a4590;
    --guess-border: #cfccec;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    html[data-theme="auto"] {
      --bg: #191918;
      --panel: #232322;
      --panel-alt: #1f1f1e;
      --border: #353533;
      --text: #eceae5;
      --muted: #9a978f;
      --accent: #8fc3a1;
      --accent-soft: #24352b;
      --warn-bg: #3a2e18;
      --warn-text: #e9c37c;
      --warn-border: #574526;
      --ok-bg: #24352b;
      --ok-text: #9dcfae;
      --ok-border: #35513f;
      --guess-bg: #272641;
      --guess-text: #b4b0ec;
      --guess-border: #3b3966;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
    }
  }
  html[data-theme="dark"] {
    --bg: #191918; --panel: #232322; --panel-alt: #1f1f1e; --border: #353533;
    --text: #eceae5; --muted: #9a978f; --accent: #8fc3a1; --accent-soft: #24352b;
    --warn-bg: #3a2e18; --warn-text: #e9c37c; --warn-border: #574526;
    --ok-bg: #24352b; --ok-text: #9dcfae; --ok-border: #35513f;
    --guess-bg: #272641; --guess-text: #b4b0ec; --guess-border: #3b3966;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
  }
  html[data-theme="light"] {
    --bg: #f7f7f5; --panel: #ffffff; --panel-alt: #fbfbfa; --border: #e3e2de;
    --text: #1f1e1c; --muted: #6b6963; --accent: #3f6d4e; --accent-soft: #e6efe8;
    --warn-bg: #fdf1dc; --warn-text: #8a5a10; --warn-border: #e9cf9d;
    --ok-bg: #e6efe8; --ok-text: #2f5c3d; --ok-border: #c3dbc9;
    --guess-bg: #ecebfa; --guess-text: #4a4590; --guess-border: #cfccec;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
                 "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; }
  h1 { font-size: 25px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .theme-btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 13px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .theme-btn:hover { border-color: var(--accent); }

  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 16px; box-shadow: var(--shadow); min-width: 110px;
  }
  .stat .n { font-size: 21px; font-weight: 650; line-height: 1.2; }
  .stat .l { font-size: 12px; color: var(--muted); }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
  .tab {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 7px 15px; font-size: 13.5px; cursor: pointer; font-family: inherit;
    transition: background .12s, border-color .12s;
  }
  .tab:hover { border-color: var(--accent); }
  .tab[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .search {
    flex: 1 1 220px; min-width: 180px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; font-family: inherit;
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .toggle-line { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }

  .badge {
    display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px;
    border-radius: 999px; border: 1px solid transparent; white-space: nowrap; line-height: 1.6;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }
  .badge.guess { background: var(--guess-bg); color: var(--guess-text); border-color: var(--guess-border); }
  .badge.plain { background: var(--panel-alt); color: var(--muted); border-color: var(--border); }

  .view-title { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 30px 0 10px; }

  .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; min-width: 1000px; font-size: 13px; }
  th, td { text-align: left; vertical-align: top; padding: 11px 13px; border-bottom: 1px solid var(--border); }
  thead th { background: var(--panel-alt); font-size: 12px; color: var(--muted); font-weight: 600;
             position: sticky; top: 0; z-index: 2; border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--panel-alt); }
  td.name { min-width: 210px; }
  td.name a { color: var(--text); font-weight: 600; text-decoration: none; }
  td.name a:hover { color: var(--accent); text-decoration: underline; }
  td ul { margin: 0; padding-left: 16px; }
  td li { margin-bottom: 3px; }
  .cellmuted { color: var(--muted); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 17px; box-shadow: var(--shadow); }
  .card.flagged { border-left: 3px solid var(--warn-border); }
  .card h3 { font-size: 15.5px; margin: 0 0 7px; line-height: 1.4; }
  .card h3 a { color: var(--text); text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .card .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .card p { margin: 0 0 9px; font-size: 13.5px; }
  .card dt { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 8px; }
  .card dd { margin: 1px 0 0; font-size: 13px; }
  .card .src { font-size: 12px; margin-top: 11px; }
  .card .src a { color: var(--accent); word-break: break-all; }

  .notelink { background: none; border: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
  .notelink:hover { color: var(--accent); text-decoration: underline; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50;
    display: flex; justify-content: center; align-items: flex-start; padding: 4vh 16px;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .overlay[hidden] { display: none; }
  .sheet {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.3); max-width: 780px; width: 100%;
    padding: 26px 30px 34px; margin-bottom: 4vh;
  }
  .sheet-top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .sheet h2 { font-size: 20px; margin: 0; line-height: 1.4; letter-spacing: -.01em; }
  .close-btn {
    flex: 0 0 auto; background: var(--panel-alt); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; width: 32px; height: 32px; font-size: 17px; line-height: 1; cursor: pointer; font-family: inherit;
  }
  .close-btn:hover { border-color: var(--accent); color: var(--accent); }

  .facts { border: 1px solid var(--border); border-radius: 10px; background: var(--panel-alt); padding: 4px 16px; margin: 14px 0 20px; }
  .facts dl { display: grid; grid-template-columns: 120px 1fr; gap: 2px 14px; margin: 12px 0; font-size: 13px; }
  .facts dt { color: var(--muted); font-size: 12px; padding-top: 1px; }
  .facts dd { margin: 0; }
  .facts ul { margin: 0; padding-left: 16px; }

  .prose { font-size: 14.5px; }
  .prose h3 { font-size: 15px; margin: 24px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border); letter-spacing: .01em; }
  .prose h4 { font-size: 14px; margin: 18px 0 6px; }
  .prose p { margin: 0 0 11px; }
  .prose ul, .prose ol { margin: 0 0 11px; padding-left: 20px; }
  .prose li { margin-bottom: 5px; }
  .prose li > ul, .prose li > ol { margin-top: 5px; }
  .prose blockquote {
    margin: 14px 0; padding: 10px 16px; border-left: 3px solid var(--accent);
    background: var(--accent-soft); border-radius: 0 8px 8px 0;
  }
  .prose blockquote p:last-child { margin-bottom: 0; }
  .prose code { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  .prose a { color: var(--accent); }
  .prose a.xref { border-bottom: 1px dashed var(--accent); text-decoration: none; }

  .empty { padding: 40px; text-align: center; color: var(--muted); }
  footer { margin-top: 40px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 14px; }

  @media (max-width: 640px) {
    .wrap { padding: 20px 14px 60px; }
    h1 { font-size: 21px; }
    .cards { grid-template-columns: 1fr; }
    .overlay { padding: 0; }
    .sheet { border-radius: 0; border: none; padding: 20px 16px 40px; margin-bottom: 0; min-height: 100%; }
    .facts dl { grid-template-columns: 1fr; gap: 0 0; }
    .facts dt { margin-top: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>사례조사 대시보드</h1>
      <p class="sub">골프 수강생 유형 분류 &amp; 티칭 가이드 서비스 — 경쟁사 / 니즈검증 / 인접산업</p>
    </div>
    <button class="theme-btn" id="themeBtn" type="button">테마: 자동</button>
  </header>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <div id="tabs" role="tablist" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
    <input class="search" id="search" type="search" placeholder="제목 · 태그 · 내용 검색" aria-label="검색">
    <label class="toggle-line"><input type="checkbox" id="onlyFlag"> 확인필요만</label>
  </div>

  <h2 class="view-title">사례 비교 표</h2>
  <div class="tablewrap"><table id="cmp"><thead></thead><tbody></tbody></table></div>

  <h2 class="view-title">사례 카드</h2>
  <div class="cards" id="cards"></div>

  <footer id="foot"></footer>
</div>

<div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <article class="sheet" id="sheet"></article>
</div>

gths": ["신체 기반 분류 교육에 실제로 돈과 시간을 쓰는 시장이 제도 수준으로 존재 — 가설2의 '정리 가능성'은 이미 입증됨", "TPI Level 1이 NSCA·ACE·NASM 보수교육 학점으로 인정 = 외부 검증된 지식 체계", "PGA는 Level 1에서 'Introduction to Teaching' 모듈을 다루고 이후 교습 트랙으로 분기 — 교습 역량이 별도 전문 영역으로 제도화되어 있음"], "weaknesses": ["PGA PGM 커리큘럼의 Level 1 공개 모듈 목록은 고객관계·카트 관리·클럽 퍼포먼스 등 운영 비중이 크고, 신체 기반 유형 분류는 명시적으로 등장하지 않음 — 즉 PGA 본류는 이 영역을 TPI 같은 외부 인증에 위임", "국내 KPGA/KLPGA 티칭 자격 커리큘럼은 이번 조사 범위에서 미확인"], "data_or_evidence_used": "TPI 인증 공식 페이지, PGA.com 'How to become a PGA Professional', 위스콘신/미드웨스트 PGA 섹션의 PGM 로드맵 PDF, 대학 PGM 프로그램 카탈로그", "relevance_to_us": "가설2를 가장 강하게 지지하는 근거. '유형별 티칭 방식을 문헌·데이터로 정리할 수 있는가?' → 이미 정리되어 인증 상품으로 팔리고 있다.", "differentiation_gap": "제도가 지식을 '사람 머리에 주입하는 방식'으로만 유통시키고 있다. 같은 지식을 '입력하면 나오는 도구'로 유통시키는 사업자는 안 보임. 단, 그것이 기회인지 '코치들이 도구화를 원치 않아서'인지는 미검증.", "tags": ["니즈검증", "인증", "커리큘럼", "제도", "가설2지지"], "summary": "신체 스크린 → 스윙 특성 해석이라는 지식 체계는 이미 TPI를 통해 인증 상품으로 존재하고, 의료·피트니스 협회의 보수교육 학점으로도 인정된다. 가설2는 사실상 이미 참이다. 미검증인 것은 \"그 지식을 소프트웨어로 전달했을 때 코치가 돈을 내는가\"뿐이다.", "judgement": "- 이 구조가 시사하는 바: 골프 교습 지식 시장의 지불 주체는 이미 코치 본인이고, 지불 형태는 '자격증'이다. 우리가 구독 SaaS를 팔려면 자격증이 주는 두 가지 부가가치(권위 시그널, 커뮤니티)를 어떻게든 대체하거나 우회해야 한다.\n- 확인필요: KPGA/KLPGA 티칭프로 자격 커리큘럼에 신체 평가가 포함되는지 — 국내 시장 진입 시 필수 확인 항목.", "body_html": "<h3>요약<\/h3><p>신체 스크린 → 스윙 특성 해석이라는 지식 체계는 이미 TPI를 통해 인증 상품으로 존재하고, 의료·피트니스 협회의 보수교육 학점으로도 인정된다. 가설2는 사실상 이미 참이다. 미검증인 것은 \"그 지식을 소프트웨어로 전달했을 때 코치가 돈을 내는가\"뿐이다.<\/p><h3>상세 노트<\/h3><ul><li>TPI Level 1 학습 목표: 선수의 신체적 준비 상태를 빠르게 평가하고, 그 평가 결과가 선수의 스윙 특성과 어떻게 상관되는지 이해하기.<\/li><li>TPI Level 1은 NSCA, ACE, NASM에서 보수교육으로 인정.<\/li><li>PGA PGM: 3단계 코스워크 + 텍사스 프리스코 세미나. Level 1 모듈 예시 — Customer Relations, Golf Car Fleet Management, Introduction to Teaching and Club Performance + 2.5일 세미나. Level 1 이후 Teaching &amp; Coaching 커리어 패스 선택 가능.<\/li><li>대학 연계 PGA Golf Management: 4.5년 학사 + PGM Level 1~3 + 16개월 인턴십 + PAT.<\/li><\/ul><h3>판단 메모<\/h3><ul><li>이 구조가 시사하는 바: 골프 교습 지식 시장의 지불 주체는 이미 코치 본인이고, 지불 형태는 '자격증'이다. 우리가 구독 SaaS를 팔려면 자격증이 주는 두 가지 부가가치(권위 시그널, 커뮤니티)를 어떻게든 대체하거나 우회해야 한다.<\/li><li>확인필요: KPGA/KLPGA 티칭프로 자격 커리큘럼에 신체 평가가 포함되는지 — 국내 시장 진입 시 필수 확인 항목.<\/li><\/ul>", "slug": "TPI_PGA_인증커리큘럼_제도적근거"}, {"title": "골프 프로 대상 인터뷰 질문지 초안", "category": "니즈검증", "folder": "02_니즈검증", "filename": "interview_questions_draft.md", "relpath": "02_니즈검증/interview_questions_draft.md", "source_url": "", "source_type": "인터뷰", "date_collected": "2026-09-12", "confidence": "확인됨", "target_customer": "국내 레슨프로 (경력 1~3년 / 5년 이상 / 아카데미 운영자 3개 세그먼트)", "pricing": "", "core_offering": "가설1·2·3 검증을 위한 반구조화 인터뷰 가이드", "strengths": [], "weaknesses": [], "data_or_evidence_used": "본 리서치 §01·§02 노트에서 도출된 미검증 지점", "relevance_to_us": "가설1·2·3 전부. 이번 데스크 리서치로 확인 불가능했던 국내 1차 데이터를 채우는 유일한 수단", "differentiation_gap": "", "tags": ["인터뷰", "질문지", "니즈검증", "액션아이템"], "summary": "데스크 리서치로 검증할 수 없었던 세 가지 — ① 국내 프로의 실제 페인포인트, ② 유형 분류를 도구로 받아들일 의향, ③ 실제 지불 의향과 지불 주체 — 를 확인하기 위한 인터뷰 가이드. 출처: [[국내_레슨프로_시장현실_지불여력]], [[티칭프로_커뮤니티_페인포인트_해외]], [[TPI_Titleist_Performance_Institute]]", "judgement": "- **가장 중요한 두 문항은 16번과 18번.** 16번은 \"AI 판정을 신뢰할 것인가\"(제품 실현 가능성), 18번 후반부는 \"지불 주체가 누구인가\"(사업 모델)를 가른다. 나머지는 맥락이다.\n- 11번(실제 지출 이력)이 18번(지불 의향)의 거짓말 탐지기 역할을 한다. 11번에서 \"돈 쓴 적 없다\"고 한 사람의 18번 답변은 할인해서 받아들일 것.\n- 인터뷰 3~4건 시점에 답변이 수렴하는지 중간 점검하고, 수렴하지 않으면 세그먼트 정의를 다시 잡을 것.", "body_html": "<h3>요약<\/h3><p>데스크 리서치로 검증할 수 없었던 세 가지 — ① 국내 프로의 실제 페인포인트, ② 유형 분류를 도구로 받아들일 의향, ③ 실제 지불 의향과 지불 주체 — 를 확인하기 위한 인터뷰 가이드. 출처: <a class=\"xref\" href=\"#\" data-note=\"국내_레슨프로_시장현실_지불여력\">국내_레슨프로_시장현실_지불여력<\/a>, <a class=\"xref\" href=\"#\" data-note=\"티칭프로_커뮤니티_페인포인트_해외\">티칭프로_커뮤니티_페인포인트_해외<\/a>, <a class=\"xref\" href=\"#\" data-note=\"TPI_Titleist_Performance_Institute\">TPI_Titleist_Performance_Institute<\/a><\/p><h3>상세 노트<\/h3><h4>진행 원칙<\/h4><ul><li><strong>솔루션을 먼저 설명하지 말 것.<\/strong> A~C 섹션이 끝나기 전에 우리 아이디어를 꺼내면 그 뒤 답변은 전부 오염된다.<\/li><li>의견(\"~할 것 같다\")이 아니라 <strong>행동 기록<\/strong>(\"최근 3개월에 실제로 뭘 했나\")을 묻는다.<\/li><li>목표 대상: 경력 1~3년 4명 / 5년 이상 4명 / 아카데미 운영자 3명. 회당 40~50분.<\/li><\/ul><h4>A. 워밍업 &amp; 현재 워크플로우 (5분)<\/h4><ol><li>지금 주당 몇 명, 몇 회차를 가르치시나요? 수강생 구성은 어떻게 되나요?<\/li><li>새 수강생이 처음 왔을 때, 첫 회차에 실제로 무엇을 하시는지 순서대로 말씀해 주세요.<\/li><li>그때 수강생에 대해 기록으로 남기는 게 있나요? 어디에, 어떤 형태로요? (앱? 노트? 안 남김?)<\/li><\/ol><h4>B. 페인포인트 — 가설1·2 (15분)<\/h4><ol><li>최근에 \"이 수강생은 잘 안 풀린다\"고 느꼈던 케이스를 하나만 구체적으로 들려주세요. 무엇이 막혔나요?<\/li><li>그때 어떻게 대응하셨나요? 누구에게 물어보거나, 어디를 찾아보셨나요?<\/li><li>수강생을 마음속으로 몇 가지 부류로 나눠서 보시나요? 나눈다면 기준이 뭔가요? <em>(자유 응답 → 그 기준이 신체인지, 실력인지, 성격/학습태도인지가 핵심 관찰 포인트)<\/em><\/li><li>몸 상태(유연성, 체형, 가동범위, 근력)를 실제로 확인하고 레슨 방향을 바꾸신 적이 있나요? 있다면 어떻게 확인하셨나요?<\/li><li>TPI 같은 신체 스크리닝 체계를 들어보셨거나 배우신 적 있나요? 배웠다면 현장에서 실제로 쓰시나요? 안 쓴다면 왜요?<\/li><li>같은 문제(예: 슬라이스)를 가진 두 수강생에게 다른 처방을 내리는 기준은 무엇인가요?<\/li><\/ol><h4>C. 현재 대안과 정보 탐색 (8분)<\/h4><ol><li>티칭 방법을 공부할 때 주로 어디를 보시나요? (유튜브/세미나/선배/자격 과정 등)<\/li><li>최근 1년간 티칭 역량이나 장비에 <strong>실제로 돈을 쓰신 적<\/strong>이 있나요? 얼마, 어디에요?<\/li><li>수강생에게 유튜브 영상을 추천해 주신 적 있나요? 어떻게 고르시나요? <em>(→ 매칭 니즈 확인)<\/em><\/li><li>지금 쓰시는 레슨 관리 프로그램이 있나요? (골프데스크/구스트 등) 그건 누가 결제하나요?<\/li><\/ol><h4>D. 솔루션 반응 — 가설2·3 (12분)<\/h4><p><em>여기서 처음으로 컨셉 제시: \"수강생의 신체 정보와 수업 기록을 입력하면 유형을 자동 분류하고, 그 유형에 맞는 티칭 방식과 참고 영상을 제안해주는 도구\"<\/em><\/p><ol><li>방금 설명을 듣고 가장 먼저 든 생각은 무엇인가요? (부정적 반응도 그대로 받아적을 것)<\/li><li>이게 있다면 어느 순간에 쓰실 것 같나요? 첫 상담? 매 회차? 안 쓰실 것 같나요?<\/li><li>이 도구가 제안한 유형 분류가 본인 판단과 다르면 어떻게 하시겠어요? <em>(신뢰 임계치 탐색 — 핵심 질문)<\/em><\/li><li>입력에 수강생 1명당 5분이 걸린다면 쓰실 의향이 있나요? 10분이면요? <em>(비용은 돈이 아니라 시간이다)<\/em><\/li><li><strong>이런 도구가 있다면 쓸 의향이 있으신가요? 있다면 한 달에 얼마까지 내실 수 있나요?<\/strong> 이어서: 그 돈은 프로님 개인 지갑에서 나가나요, 아니면 센터에서 결제하나요?<\/li><li>지금 당장 결제 링크를 드리면 결제하시겠어요? 아니라면, 무엇이 충족돼야 결제하시겠어요?<\/li><li>반대로, 이 도구를 쓰는 것이 본인 전문성에 대한 평가를 낮추게 만든다고 느끼실 여지가 있나요? <em>(§02 해외 커뮤니티 담론에서 도출된 리스크)<\/em><\/li><\/ol><h4>E. 마무리 (5분)<\/h4><ol><li>제가 여쭤봤어야 했는데 안 여쭤본 게 있을까요?<\/li><li>같은 얘기를 나눠볼 만한 다른 프로님을 소개해 주실 수 있을까요?<\/li><\/ol><h3>판단 메모<\/h3><ul><li><strong>가장 중요한 두 문항은 16번과 18번.<\/strong> 16번은 \"AI 판정을 신뢰할 것인가\"(제품 실현 가능성), 18번 후반부는 \"지불 주체가 누구인가\"(사업 모델)를 가른다. 나머지는 맥락이다.<\/li><li>11번(실제 지출 이력)이 18번(지불 의향)의 거짓말 탐지기 역할을 한다. 11번에서 \"돈 쓴 적 없다\"고 한 사람의 18번 답변은 할인해서 받아들일 것.<\/li><li>인터뷰 3~4건 시점에 답변이 수렴하는지 중간 점검하고, 수렴하지 않으면 세그먼트 정의를 다시 잡을 것.<\/li><\/ul>", "slug": "interview_questions_draft"}, {"title": "국내 레슨프로 시장 현실 — 수입 편차, 시장 축소, 지불여력", "category": "니즈검증", "folder": "02_니즈검증", "filename": "국내_레슨프로_시장현실_지불여력.md", "relpath": "02_니즈검증/국내_레슨프로_시장현실_지불여력.md", "source_url": "https://www.m-i.kr/news/articleView.html?idxno=1355542", "source_type": "기사", "date_collected": "2026-09-12", "confidence": "확인필요", "target_customer": "국내 골프 레슨프로 및 연습장/아카데미 운영자", "pricing": "N/A (시장 환경 조사)", "core_offering": "N/A", "strengths": ["레슨프로 수입 상단이 존재 — 잘하는 프로는 월 수천만원대까지 감 (=성과 개선에 투자할 동기가 있는 상위층 존재)", "'회원에게 인정받는 것'이 수입과 직결되는 구조 → 티칭 품질 개선이 곧 매출이라는 ROI 스토리를 만들 수 있음"], "weaknesses": ["골프 인구 3년 연속 감소 (2022년 5,058만 → 2023년 4,772만 → 2024년 4,741만 → 2025년 4,641만 이용객). 2030년까지 추가 감소 전망, 특히 40~50대 6.2% 감소 예상", "연습장 폐업 증가 (서울에서만 한 해 52곳 폐업 사례 보도)", "레슨 단가 하락, 다수 연습장이 프로 기본급 폐지 — 프로 개인의 현금 여력 악화", "수입 편차 극단적(월 200만원대 ~ 월 2,000만원) → 하위층은 유료 도구 구매 여력이 사실상 없음"], "data_or_evidence_used": "매일일보/한국일보 골프산업 기사(이용객 통계), 경향신문 연습장 폐업 기사, 야놀자리서치 골프산업 전망 리포트, 현직 레슨프로 본인 서술(Threads 게시글)", "relevance_to_us": "가설3(지불의향)에 대한 가장 강한 반대 근거. 시장이 축소 중이고 공급자(프로)가 과잉이며 단가가 눌리는 구간에서는 신규 SaaS 지출이 가장 먼저 잘린다.", "differentiation_gap": "판매 대상을 재고해야 함: 여력 없는 개인 프로 다수(B2C)가 아니라, 프로를 다수 고용하고 회원 이탈률에 민감한 아카데미/연습장(B2B)이 지불 주체일 가능성이 높다.", "tags": ["니즈검증", "국내시장", "지불의향", "리스크", "가설3반대근거"], "summary": "국내 골프 시장은 2022년 정점 이후 3년 연속 축소 중이고, 연습장 폐업과 레슨 단가 하락, 기본급 폐지가 동시에 진행 중이다. 개인 레슨프로의 지불여력 가정은 낙관적이며, 가설3은 이번 리서치에서 가장 약하게 지지된다.", "judgement": "- **confidence 확인필요 사유**: 이용객 수치는 복수 기사에서 일관되나 원출처(문체부/한국골프장경영협회 등) 원자료를 직접 확인하지 못했다. 프로 수입 서술은 익명 개인 SNS 게시글 1건이므로 일반화 불가 — 인터뷰로 교차검증 필요.\n- 전략 함의 3가지:\n  1. 가격을 월 3~5만원대로 잡는 기존 가정은 위험. 골프데스크 연 36만원(전체 CRM)이 현실적 천장 참고치.\n  2. 판매 대상을 아카데미/연습장 B2B로 이동시키면 \"프로 1명이 회원 1명 더 유지 = 월 20만원\"이라는 ROI 계산이 성립.\n  3. 시장 축소는 오히려 \"차별화가 필요한 프로\"의 동기를 키울 수도 있다 — 이 가설은 인터뷰로 확인 가치가 있음.\n- 확인필요: 국내 레슨프로 총수(KPGA/KLPGA 티칭 자격 보유자 수), 연습장 수 추이 원자료.", "body_html": "<h3>요약<\/h3><p>국내 골프 시장은 2022년 정점 이후 3년 연속 축소 중이고, 연습장 폐업과 레슨 단가 하락, 기본급 폐지가 동시에 진행 중이다. 개인 레슨프로의 지불여력 가정은 낙관적이며, 가설3은 이번 리서치에서 가장 약하게 지지된다.<\/p><h3>상세 노트<\/h3><ul><li>골프장 이용객: 2022년 5,058만명(정점) → 2023년 4,772만명 → 2024년 4,741만명 → 2025년 4,641만명(전년비 약 100만명, 2.1% 감소). 3년 연속 감소.<\/li><li>원인: 경기 침체, 고비용 부담(클럽·의류·그린피 인상), 해외 골프여행 증가, 2030세대 이탈.<\/li><li>전망: 2030년 골프인구 2025년 대비 1.3% 감소, 주력인 40~50대는 6.2% 감소 예상. 지방은 더 가파를 가능성.<\/li><li>연습장: 서울에서만 한 해 52곳 폐업, 특정 분기에 10곳 폐업 보도.<\/li><li>프로 처우(현직자 서술): 못 버는 사람 월 200만원대, 잘 버는 프로는 월 2,000만원 근접. \"레슨 단가는 이미 많이 내려서 더 못 내림\", \"많은 연습장이 프로 기본급을 없앰\", \"자격증 따고도 골프를 떠나 공장·아르바이트로 가는 사람들\".<\/li><\/ul><h3>판단 메모<\/h3><ul><li><strong>confidence 확인필요 사유<\/strong>: 이용객 수치는 복수 기사에서 일관되나 원출처(문체부/한국골프장경영협회 등) 원자료를 직접 확인하지 못했다. 프로 수입 서술은 익명 개인 SNS 게시글 1건이므로 일반화 불가 — 인터뷰로 교차검증 필요.<\/li><li>전략 함의 3가지:<ol><li>가격을 월 3~5만원대로 잡는 기존 가정은 위험. 골프데스크 연 36만원(전체 CRM)이 현실적 천장 참고치.<\/li><li>판매 대상을 아카데미/연습장 B2B로 이동시키면 \"프로 1명이 회원 1명 더 유지 = 월 20만원\"이라는 ROI 계산이 성립.<\/li><li>시장 축소는 오히려 \"차별화가 필요한 프로\"의 동기를 키울 수도 있다 — 이 가설은 인터뷰로 확인 가치가 있음.<\/li><\/ol><\/li><li>확인필요: 국내 레슨프로 총수(KPGA/KLPGA 티칭 자격 보유자 수), 연습장 수 추이 원자료.<\/li><\/ul>", "slug": "국내_레슨프로_시장현실_지불여력"}, {"title": "스포츠과학 문헌 — 신체 특징으로 골퍼를 유형화할 수 있는가 (가설1 직접 검증)", "category": "니즈검증", "folder": "02_니즈검증", "filename": "스포츠과학_문헌_신체기반유형화_타당성.md", "relpath": "02_니즈검증/스포츠과학_문헌_신체기반유형화_타당성.md", "source_url": "https://pubmed.ncbi.nlm.nih.gov/19675474/", "source_type": "논문", "date_collected": "2026-09-12", "confidence": "확인필요", "target_customer": "N/A (문헌 검토)", "pricing": "N/A", "core_offering": "N/A", "strengths": ["신체 변인이 골프 퍼포먼스와 상관된다는 근거는 다수 존재 — 인체계측(어깨너비, 팔 길이), 하체·상체 근력이 클럽헤드 스피드와 유의한 연관", "저핸디캡 vs 고핸디캡 집단이 신체 변인으로 구분된다는 연구 존재 (저핸디캡: 클럽헤드 속도 12% 빠름, 우드촙 근력 28% 높음, 상완·전체 팔 길이 김)", "즉 '신체 데이터로 골퍼 집단을 구분한다'는 발상 자체는 문헌적으로 지지됨"], "weaknesses": ["결정적 반증: 최근 메타분석에서 **유연성(flexibility)은 클럽헤드 스피드와 통계적으로 유의하지 않은 사소한(trivial) 연관**으로 보고됨. 우리 가설1이 앞세운 '유연성' 축의 설명력이 약할 수 있음", "기존 연구 대부분이 '퍼포먼스(클럽헤드 스피드) 예측'이지 '티칭 방식 처방'이 아님 — 가설2로 가는 다리가 문헌에 없음", "핸디캡은 실력 구분이지 '유형' 구분이 아님. 우리가 원하는 것은 실력 축이 아닌 직교하는 유형 축인데 그 근거는 미확인", "골프 스윙 분류 관련 특허(swing trajectory 기반 계층 분류)는 존재하나 신체 기반이 아님"], "data_or_evidence_used": "JSCR 'Physical Determinants of Golf Swing Performance: A Review', PubMed 19675474 (Are anthropometric, flexibility, muscular strength, and endurance variables related to clubhead velocity in low- and high-handicap golfers?), 'Associations Between Physical Characteristics and Golf Clubhead Speed: A Systematic Review with Meta-Analysis', Springer 'Movement Analysis of the Golf Swing'", "relevance_to_us": "가설1의 유일한 객관적 검증 경로. 결론: 부분 지지 + 중요한 단서.", "differentiation_gap": "문헌은 '신체 → 퍼포먼스'는 말하지만 '신체 → 유형 → 최적 티칭법'은 말하지 않는다. 이 마지막 연결고리가 우리 제품의 지적 자산이자 동시에 최대 미검증 리스크.", "tags": ["니즈검증", "문헌", "가설1", "리스크", "확인필요"], "summary": "신체 변인이 골프 퍼포먼스와 연결된다는 문헌 근거는 충분하지만, (a) 유연성의 설명력은 최신 메타분석에서 약하게 나왔고, (b) '유형화 → 티칭 처방'이라는 우리 핵심 연결고리를 직접 검증한 연구는 확인되지 않았다. 가설1은 \"부분적으로 지지, 핵심 부분은 미검증\".", "judgement": "- **가설1을 즉시 수정할 것**: \"유연성·체형·근력·관절가동범위\"를 동급으로 나열하면 안 된다. 근력·인체계측은 근거가 있고 유연성은 근거가 약하다. 유연성을 핵심 축으로 쓰려면 별도 근거가 필요하다.\n- 다만 반론 여지: 메타분석은 '클럽헤드 스피드'라는 단일 출력만 봤다. 우리가 관심 있는 출력은 속도가 아니라 '어떤 티칭이 이 사람에게 먹히는가'이며, 이 출력에 대한 연구는 사실상 없다. 즉 반증도 아니고 지지도 아닌 공백.\n- confidence 확인필요 사유: 개별 논문 원문(전문)을 열람하지 않고 초록·요약·리뷰 인용 수준에서 정리했다. 사업 의사결정 근거로 쓰려면 최소 메타분석 1편 전문 확인 필요.\n- 다음 액션: TPI가 12 swing characteristics ↔ 16 screens 상관을 어떤 데이터로 주장하는지(내부 데이터인지, 피어리뷰 논문인지) 추적. 이게 우리 가설2의 실질적 근거 수준을 결정한다.", "body_html": "<h3>요약<\/h3><p>신체 변인이 골프 퍼포먼스와 연결된다는 문헌 근거는 충분하지만, (a) 유연성의 설명력은 최신 메타분석에서 약하게 나왔고, (b) '유형화 → 티칭 처방'이라는 우리 핵심 연결고리를 직접 검증한 연구는 확인되지 않았다. 가설1은 \"부분적으로 지지, 핵심 부분은 미검증\".<\/p><h3>상세 노트<\/h3><ul><li>인체계측·균형·심폐능력 + 근력/파워/근건 특성/유연성이 클럽헤드 스피드와 캐리에 영향 (리뷰).<\/li><li>어깨너비가 넓으면 안정성과 레버리지 향상, 고관절·대퇴 둘레는 근육량·근력과 양의 상관.<\/li><li>저핸디캡 vs 고핸디캡: 클럽헤드 속도 12%↑, 골프 특이적 케이블 우드촙 근력 28%↑, 상완 및 전체 팔 길이 김.<\/li><li><strong>메타분석<\/strong>: 클럽헤드 스피드와 하체 근력·상체 근력·인체계측은 유의한 연관, <strong>유연성은 trivial, 비유의<\/strong>.<\/li><li>스윙 궤적 특징을 추출해 스윙   } else {
    cards.innerHTML = rows.map(n => {
      const tags = n.tags.slice(0, 6).map(t => '<span class="badge plain">' + esc(t) + "</span>").join("");
      return '<article class="card' + (n.confidence === "확인필요" ? " flagged" : "") + '">' +
        '<h3><button class="notelink" data-note="' + esc(n.slug) + '">' + esc(n.title) + "</button></h3>" +
        '<div class="meta"><span class="badge ' + badgeClass(n.confidence) + '">' + esc(n.confidence) + "</span>" +
        '<span class="badge plain">' + esc(n.category) + "</span>" +
        (n.date_collected ? '<span class="badge plain">' + esc(n.date_collected) + "</span>" : "") + "</div>" +
        (n.summary ? "<p>" + esc(n.summary) + "</p>" : "") +
        (n.relevance_to_us ? "<dl><dt>우리 가설과의 관련</dt><dd>" + esc(n.relevance_to_us) + "</dd></dl>" : "") +
        (n.differentiation_gap ? "<dl><dt>차별화 gap</dt><dd>" + esc(n.differentiation_gap) + "</dd></dl>" : "") +
        (tags ? '<div class="meta" style="margin-top:10px">' + tags + "</div>" : "") +
        '<div class="src">' + (n.source_url
            ? '출처: <a href="' + esc(n.source_url) + '" target="_blank" rel="noopener">' + esc(n.source_url) + "</a>"
            : '<span class="cellmuted">출처 URL 없음</span>') + "</div>" +
        "</article>";
    }).join("");
  }

  document.getElementById("foot").textContent =
    "생성 시각 " + GENERATED + " · 표시 중 " + rows.length + " / 전체 " + NOTES.length +
    "건 · 제목을 클릭하면 노트 전문을 볼 수 있습니다 · 노트를 추가한 뒤 build_dashboard.py 를 다시 실행하면 갱신됩니다.";
}

// ---------- 노트 상세뷰 ----------
const overlay = document.getElementById("overlay");
const sheet = document.getElementById("sheet");
const bySlug = {};
NOTES.forEach(n => { bySlug[n.slug] = n; });
let lastFocus = null;

function factRow(label, value) {
  if (!value || (Array.isArray(value) && !value.length)) return "";
  const body = Array.isArray(value)
    ? "<ul>" + value.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>"
    : esc(value);
  return "<dt>" + esc(label) + "</dt><dd>" + body + "</dd>";
}

function openNote(slug) {
  const n = bySlug[slug];
  if (!n) return;
  lastFocus = document.activeElement;

  const facts = [
    factRow("타겟 고객", n.target_customer),
    factRow("가격", n.pricing),
    factRow("핵심 제공가치", n.core_offering),
    factRow("강점", n.strengths),
    factRow("약점", n.weaknesses),
    factRow("근거 자료", n.data_or_evidence_used),
    factRow("우리 가설과의 관련", n.relevance_to_us),
    factRow("차별화 gap", n.differentiation_gap),
  ].join("");

  sheet.innerHTML =
    '<div class="sheet-top"><h2 id="sheetTitle">' + esc(n.title) + "</h2>" +
    '<button class="close-btn" id="closeBtn" aria-label="닫기">&times;</button></div>' +
    '<div class="meta"><span class="badge ' + badgeClass(n.confidence) + '">' + esc(n.confidence) + "</span>" +
    '<span class="badge plain">' + esc(n.category) + "</span>" +
    (n.source_type ? '<span class="badge plain">' + esc(n.source_type) + "</span>" : "") +
    (n.date_collected ? '<span class="badge plain">' + esc(n.date_collected) + "</span>" : "") +
    (n.tags || []).map(t => '<span class="badge plain">' + esc(t) + "</span>").join("") + "</div>" +
    (n.source_url
      ? '<p style="font-size:12.5px;margin:10px 0 0">출처: <a href="' + esc(n.source_url) +
        '" target="_blank" rel="noopener" style="color:var(--accent);word-break:break-all">' + esc(n.source_url) + "</a></p>"
      : '<p style="font-size:12.5px;margin:10px 0 0" class="cellmuted">출처 URL 없음</p>') +
    (facts ? '<div class="facts"><dl>' + facts + "</dl></div>" : "") +
    '<div class="prose">' + n.body_html + "</div>" +
    '<p style="font-size:12px;margin-top:24px" class="cellmuted">원본 파일: ' + esc(n.relpath) + "</p>";

  overlay.hidden = false;
  document.body.style.overflow = "hidden";
  overlay.scrollTop = 0;
  document.getElementById("closeBtn").onclick = closeNote;
  document.getElementById("closeBtn").focus();
}

function closeNote() {
  overlay.hidden = true;
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}

// 노트 제목 클릭, 그리고 본문 안의 [[위키링크]] 클릭 모두 처리
document.addEventListener("click", e => {
  const trigger = e.target.closest("[data-note]");
  if (trigger) {
    e.preventDefault();
    const slug = trigger.dataset.note;
    if (bySlug[slug]) {
      openNote(slug);
    } else {
      alert("연결된 노트를 찾을 수 없습니다: " + slug);
    }
    return;
  }
  if (e.target === overlay) closeNote();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !overlay.hidden) closeNote();
});

document.getElementById("search").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById("onlyFlag").addEventListener("change", e => {
  onlyFlag = e.target.checked;
  render();
});

const themes = ["auto", "light", "dark"];
const labels = { auto: "자동", light: "라이트", dark: "다크" };
const btn = document.getElementById("themeBtn");
btn.addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme || "auto";
  const next = themes[(themes.indexOf(cur) + 1) % themes.length];
  document.documentElement.dataset.theme = next;
  btn.textContent = "테마: " + labels[next];
});

render();
</script>
</body>
</html>
